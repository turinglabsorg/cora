[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:tailscaled]
command=/usr/sbin/tailscaled --tun=userspace-networking --state=/var/lib/cora/tailscale/tailscaled.state --statedir=/var/lib/cora/tailscale --socket=/run/tailscale/tailscaled.sock
priority=5
autorestart=true
stdout_logfile=/var/log/supervisor/tailscaled.log
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=6
autorestart=true
stdout_logfile=/var/log/supervisor/sshd.log
redirect_stderr=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true

[program:desktop]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
user=agent
environment=HOME="/home/agent",USER="agent",DISPLAY=":1"
directory=/home/agent
priority=20
autorestart=true
startsecs=3

[program:vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900 -quiet
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
